<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECF Vidéothèque</title>
    <script src="assets/js/app.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@unocss/reset/normalize.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
</head>

<body class="bg-slate-700 text-white">
    
    <header class="flex flex-col items-center">
        <h1>Liste des films</h1>
        <section id="section_ajouter" class="flex">
        
        <button id="btn_ajouter" class="rounded-2 bg-slate-500 ring text-white p-1">Ajouter</button>
        </section>
        
        <section id="erreur">
        
        </section>
    </header>
    
    <main class="mx-auto w-screen-2xl">
        <section>
            <label for="filtre">Filtrer par :</label>
            <select name="filtre" id="filtre">
                <option value=""></option>
                <option value="annee">Année</option>
                <option value="titre">Titre</option>
            </select>
        </section>
        
        <table id="table" class="w-full mt-5 text-lg border-2 bg-slate-500 rounded shadow-md">
        
        </table>
    </main>

</body>

</html>
